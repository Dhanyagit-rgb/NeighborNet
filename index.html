<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeighborNet Emergency Alert</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 28px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 100%; }
    .badge { display: inline-block; background: #fee2e2; color: #dc2626; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #0f172a; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    .alert-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; width: 180px; height: 180px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4); transition: transform 0.1s, box-shadow 0.1s; outline: none; }
    .alert-btn:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(239, 68, 68, 0.4); }
    .status-box { margin-top: 24px; padding: 16px; border-radius: 12px; font-size: 14px; font-weight: 500; display: none; }
    .status-box.active { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">NeighborNet Emergency</span>
    <h1>Non-Ambulance Help</h1>
    <p>Tap below to immediately notify 2 trusted contacts and 3 nearby community volunteers.</p>

    <button class="alert-btn" id="sosBtn" onclick="triggerAlert()">1-TAP HELP</button>

    <div class="status-box" id="status">
      🚨 <strong>Alert Dispatched!</strong><br/>
      GPS location sent to nearby volunteers & contacts.
    </div>
  </div>

  <script>
    function triggerAlert() {
      const btn = document.getElementById('sosBtn');
      const status = document.getElementById('status');
      
      btn.style.background = '#059669';
      btn.innerText = 'SENT ✓';
      status.classList.add('active');

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          console.log("Alert location:", pos.coords.latitude, pos.coords.longitude);
        });
      }
    }
  </script>
</body>
</html>
